name: Monitor

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/cache@v4
        with:
          path: data
          key: monitor-state-${{ github.run_id }}
          restore-keys: monitor-state-

      - run: timeout 350m node dist/index.js || [ $? -eq 124 ]
        env:
          DATA_DIR: data
          CHECK_INTERVAL_SECONDS: "60"
          REMINDER_MINUTES: "30"
          TIME_ZONE: Asia/Manila
          PORT: "8080"
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          PROJECTS_JSON: ${{ secrets.PROJECTS_JSON }}
